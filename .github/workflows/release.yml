name: Build & Release

# Builds KidsLearn for Windows, macOS and Linux on GitHub's cloud runners
# and attaches the installers to a GitHub Release.
#
# Trigger it by pushing a version tag (e.g. v1.0.0) or manually from the
# Actions tab ("Run workflow").

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Build Electron app (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kidslearn-${{ matrix.platform }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: ignore

  # The Android APK — so the "kidslearn" installer's Android option has a file
  # to download. Signed with the real keystore when the ANDROID_KEYSTORE_BASE64
  # secret exists; otherwise a debug-signed APK (installs fine, but Android
  # treats it as a different app, so it can't upgrade an existing install).
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Build web assets and sync to Android
        run: npm run sync:android
        working-directory: client

      - name: Restore signing keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > client/android/kidslearn-release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret - building a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect the APK
        run: |
          mkdir -p dist-apk
          apk="$(find client/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          echo "Found: $apk"
          cp "$apk" "dist-apk/KidsLearn-Android.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidslearn-android
          path: dist-apk/*.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    # Never let an Android hiccup block the desktop release.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: KidsLearn ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
